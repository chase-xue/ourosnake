<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>OuroSnake: 极简赛博·自噬蜕变贪吃蛇</title>
  <link rel="icon" href="./avatar.jpg" />
  <link rel="manifest" href="./manifest.json" />
  <!-- iOS & Android 移动端全屏应用（PWA）支持 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OuroSnake" />
  <link rel="apple-touch-icon" href="./avatar.jpg" />
  <meta name="theme-color" content="#080b12" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #05070c;
      color: #f4f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #080b12;
      overflow: hidden;
      margin: auto;
    }
    /* 桌面端 / 平板大屏：模拟精美掌机圆角胶囊形态 */
    @media (min-width: 520px) and (min-height: 640px) {
      #game-container {
        width: min(430px, 92vw);
        height: min(900px, 94dvh);
        border-radius: 28px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.85), 0 0 36px rgba(141, 252, 114, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    /* 桌面端键盘操作提示条 */
    .pc-tips {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.32);
      pointer-events: none;
      letter-spacing: 0.5px;
    }
    @media (max-width: 600px) {
      .pc-tips {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="pc-tips">方向键 / WASD 移动 · 数字键 1-5 切难度 · 空格 暂停 · R 重来</div>
  </div>

  <script>
    // 微信小游戏 API 浏览器端高精度自适应垫片 (WeChat MiniGame Adapter Shim)
    (function() {
      const container = document.getElementById('game-container');
      const canvas = document.getElementById('gameCanvas');
      
      const touchStartHandlers = [];
      const touchEndHandlers = [];
      const resizeHandlers = [];

      // 获取移动端安全区域（兼容 iPhone 灵动岛/刘海与底部横条）
      function getSafeAreaInsets() {
        let top = 0;
        let bottom = 0;
        try {
          const div = document.createElement('div');
          div.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none;';
          document.body.appendChild(div);
          const cs = window.getComputedStyle(div);
          top = parseFloat(cs.paddingTop) || 0;
          bottom = parseFloat(cs.paddingBottom) || 0;
          document.body.removeChild(div);
        } catch(e) {}
        return { top, bottom };
      }

      function convertTouch(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return {
          clientX: clientX - rect.left,
          clientY: clientY - rect.top
        };
      }

      window.wx = {
        createCanvas: function() {
          return canvas;
        },
        getWindowInfo: function() {
          const rect = container.getBoundingClientRect();
          const w = Math.round(rect.width || window.innerWidth);
          const h = Math.round(rect.height || window.innerHeight);
          const dpr = Math.min(window.devicePixelRatio || 2, 3);
          const safe = getSafeAreaInsets();
          return {
            windowWidth: w,
            windowHeight: h,
            pixelRatio: dpr,
            safeArea: {
              top: safe.top,
              bottom: h - safe.bottom,
              left: 0,
              right: w
            }
          };
        },
        getSystemInfoSync: function() {
          return this.getWindowInfo();
        },
        onWindowResize: function(fn) {
          resizeHandlers.push(fn);
        },
        vibrateShort: function() {
          try {
            if (navigator.vibrate) navigator.vibrate(15);
          } catch(e) {}
        },
        getStorageSync: function(key) {
          try {
            const val = localStorage.getItem(key);
            return val ? JSON.parse(val) : null;
          } catch(e) {
            return null;
          }
        },
        setStorageSync: function(key, val) {
          try {
            localStorage.setItem(key, JSON.stringify(val));
          } catch(e) {}
        },
        onTouchStart: function(handler) {
          touchStartHandlers.push(handler);
        },
        onTouchMove: function(handler) {
          touchMoveHandlers.push(handler);
        },
        onTouchEnd: function(handler) {
          touchEndHandlers.push(handler);
        }
      };

      const touchMoveHandlers = [];

      function triggerResize() {
        if (window.innerWidth < 520 || window.innerHeight < 640) {
          container.style.height = window.innerHeight + 'px';
        } else {
          container.style.height = '';
        }
        const info = window.wx.getWindowInfo();
        resizeHandlers.forEach(fn => {
          try { fn(info); } catch(e) {}
        });
      }

      window.addEventListener('resize', triggerResize);
      window.addEventListener('orientationchange', () => setTimeout(triggerResize, 150));
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', triggerResize);
      }
      triggerResize();

      // 绑定触摸与鼠标事件
      canvas.addEventListener('touchstart', function(e) {
        if (!e.touches || !e.touches[0]) return;
        if (e.cancelable) e.preventDefault();
        const pos = convertTouch(e.touches[0].clientX, e.touches[0].clientY);
        touchStartHandlers.forEach(fn => {
          fn({ touches: [{ clientX: pos.clientX, clientY: pos.clientY }] });
        });
      }, { passive: false });

      canvas.addEventListener('touchmove', function(e) {
        if (!e.touches || !e.touches[0]) return;
        if (e.cancelable) e.preventDefault();
        const pos = convertTouch(e.touches[0].clientX, e.touches[0].clientY);
        touchMoveHandlers.forEach(fn => {
          fn({ touches: [{ clientX: pos.clientX, clientY: pos.clientY }] });
        });
      }, { passive: false });

      canvas.addEventListener('touchend', function(e) {
        if (!e.changedTouches || !e.changedTouches[0]) return;
        if (e.cancelable) e.preventDefault();
        const pos = convertTouch(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        touchEndHandlers.forEach(fn => {
          fn({ changedTouches: [{ clientX: pos.clientX, clientY: pos.clientY }] });
        });
      }, { passive: false });

      // 桌面鼠标事件映射为触控
      let isMouseDown = false;
      canvas.addEventListener('mousedown', function(e) {
        isMouseDown = true;
        const pos = convertTouch(e.clientX, e.clientY);
        touchStartHandlers.forEach(fn => {
          fn({ touches: [{ clientX: pos.clientX, clientY: pos.clientY }] });
        });
      });

      canvas.addEventListener('mousemove', function(e) {
        if (!isMouseDown) return;
        const pos = convertTouch(e.clientX, e.clientY);
        touchMoveHandlers.forEach(fn => {
          fn({ touches: [{ clientX: pos.clientX, clientY: pos.clientY }] });
        });
      });

      window.addEventListener('mouseup', function(e) {
        if (!isMouseDown) return;
        isMouseDown = false;
        const pos = convertTouch(e.clientX, e.clientY);
        touchEndHandlers.forEach(fn => {
          fn({ changedTouches: [{ clientX: pos.clientX, clientY: pos.clientY }] });
        });
      });
    })();
  </script>

  <!-- 载入游戏核心逻辑 -->
  <script src="./game.js"></script>

  <!-- 自动化实机高清展示与录制驱动 -->
  <script>
    if (typeof window !== 'undefined' && window.location && window.location.search.includes('showcase=1')) {
      const s = document.createElement('script');
      s.src = './showcase_runner.js';
      document.body.appendChild(s);
    }
  </script>

  <!-- PWA 离线支持服务工作线程注册 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
